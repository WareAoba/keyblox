[package]
name = "keyblox"
version = "1.0.0"
edition = "2021"
description = "MIDI -> Roblox 88-key virtual piano autoplayer with a falling-notes visualizer"

[dependencies]
midly = { version = "0.5", default-features = false, features = ["std", "alloc"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(windows))'.dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
